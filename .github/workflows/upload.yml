name: העלאה לרדיו
on:
  schedule:
    # Valid UTC cron, registered from the default branch. Minute 5 of every hour.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      item_id:
        description: "מזהה פריט להעלאה מיידית. ריק = כל התור"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [kikar-upload]
permissions:
  contents: write
concurrency:
  group: kikar-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: מתזמן גיבוי
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/scheduler.js --poke
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version
      - name: העלאה
        id: upload
        env:
          RADIOCAST_API_KEY: ${{ secrets.RADIOCAST_API_KEY }}
          ITEM_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.item_id || '' }}
        run: node scripts/upload.js
        continue-on-error: true
      - name: שמירת סטטוס
        run: bash scripts/ci-commit.sh "עדכון סטטוס העלאה" data/system.json data/status/uploads.json data/status/runs.json data/ads.json
      - name: תוצאה
        if: steps.upload.outcome == 'failure'
        run: exit 1
