name: מבזק שעתי
on:
  schedule:
    # Valid UTC cron, registered from the default branch only.
    # :50 arms the hour; :00 and :05 are backstops if the early run was missed.
    # The in-repo מתזמן is the clock that actually starts this workflow.
    - cron: "50 * * * *"
    - cron: "0,5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [kikar-bulletin]
permissions:
  contents: write
concurrency:
  group: kikar-bulletin
  cancel-in-progress: false
jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: מתזמן גיבוי
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/scheduler.js --poke
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version
      - name: מבזק
        id: bulletin
        env:
          RADIOCAST_API_KEY: ${{ secrets.RADIOCAST_API_KEY }}
          BULLETIN_WATCH: "1"
        run: node scripts/bulletin.js
        continue-on-error: true
      - name: שמירת סטטוס
        run: bash scripts/ci-commit.sh "עדכון מבזק שעתי" data/system.json data/status/bulletin.json
      - name: תוצאה
        if: always()
        env:
          UPLOADED: ${{ steps.bulletin.outputs.uploaded }}
          NOTE: ${{ steps.bulletin.outputs.note }}
          OUTCOME: ${{ steps.bulletin.outcome }}
        run: |
          echo "uploaded=$UPLOADED"
          if [ -n "$NOTE" ]; then echo "note=$NOTE"; fi
          if [ "$UPLOADED" = "true" ]; then
            echo "המהדורה עלתה."
            if [ -n "$NOTE" ]; then echo "ניסיונות מוקדמים שלא הצליחו: $NOTE"; fi
            exit 0
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "המבזק לא עלה. ${NOTE}"
            exit 1
          fi
          exit 0
