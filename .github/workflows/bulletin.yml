name: מבזק שעתי
on:
  schedule:
    # GitHub often starts :00 crons 10–30 min late. Arm at :50 so a modest delay
    # still reaches HH:00, and again at :00 and :05 if the early arm was missed.
    # The job then polls the feed every 60s until HH:20.
    - cron: "50 * * * *"
    - cron: "0,5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kikar-bulletin
  cancel-in-progress: false
jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version
      - name: מבזק
        id: bulletin
        env:
          RADIOCAST_API_KEY: ${{ secrets.RADIOCAST_API_KEY }}
          BULLETIN_WATCH: "1"
        run: node scripts/bulletin.js
        continue-on-error: true
      - name: שמירת סטטוס
        run: bash scripts/ci-commit.sh "עדכון מבזק שעתי" data/system.json data/status/bulletin.json
      - name: תוצאה
        if: always()
        env:
          UPLOADED: ${{ steps.bulletin.outputs.uploaded }}
          NOTE: ${{ steps.bulletin.outputs.note }}
          OUTCOME: ${{ steps.bulletin.outcome }}
        run: |
          echo "uploaded=$UPLOADED"
          if [ -n "$NOTE" ]; then echo "note=$NOTE"; fi
          if [ "$UPLOADED" = "true" ]; then
            echo "המהדורה עלתה."
            if [ -n "$NOTE" ]; then echo "ניסיונות מוקדמים שלא הצליחו: $NOTE"; fi
            exit 0
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "המבזק לא עלה. ${NOTE}"
            exit 1
          fi
          exit 0
