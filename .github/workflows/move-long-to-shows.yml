name: העברת ארוכים לתוכניות
on:
  workflow_dispatch:
  push:
    branches: [cursor/move-long-shows-fbe0]
    paths:
      - scripts/move-long-to-shows.js
permissions:
  contents: read
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: העברה
        env:
          RADIOCAST_API_KEY: ${{ secrets.RADIOCAST_API_KEY }}
        run: node scripts/move-long-to-shows.js
